<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="100%" height="100%">
  <defs>
    <linearGradient id="socialGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0E1E2E" />
      <stop offset="50%" stop-color="#142B3F" />
      <stop offset="100%" stop-color="#0B131B" />
    </linearGradient>
    <linearGradient id="neonAcc" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#48CAE4" />
      <stop offset="100%" stop-color="#00B4D8" />
    </linearGradient>
    <filter id="softGlow">
      <feGaussianBlur stdDeviation="12" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <rect width="800" height="500" fill="url(#socialGrad)" />

  <!-- Mockup Frames for Social Post -->
  <g transform="translate(260, 60)">
    <!-- Main Card -->
    <rect width="280" height="340" rx="16" fill="#162E44" stroke="#48CAE4" stroke-width="2" filter="url(#softGlow)" />
    
    <!-- Image banner inside post -->
    <rect x="20" y="20" width="240" height="180" rx="10" fill="#0B131B" />
    <!-- Gradient shape in banner -->
    <circle cx="140" cy="110" r="50" fill="rgba(72, 202, 228, 0.25)" />
    <path d="M110 130 L140 80 L170 130 Z" fill="#F5A623" opacity="0.9" />
    <text x="140" y="165" fill="#48CAE4" font-family="'IBM Plex Sans Arabic', sans-serif" font-size="14" font-weight="700" text-anchor="middle">خصم 50% لفترة محدودة</text>

    <!-- Post copy lines -->
    <rect x="20" y="220" width="160" height="14" rx="4" fill="#FFFFFF" opacity="0.9" />
    <rect x="20" y="245" width="220" height="10" rx="4" fill="#94A3B8" opacity="0.7" />
    <rect x="20" y="265" width="180" height="10" rx="4" fill="#94A3B8" opacity="0.5" />

    <!-- Button -->
    <rect x="20" y="290" width="240" height="32" rx="8" fill="url(#neonAcc)" />
    <text x="140" y="311" fill="#0B131B" font-family="'IBM Plex Sans Arabic', sans-serif" font-size="13" font-weight="700" text-anchor="middle">تسوق الآن عبر الموقع</text>
  </g>

  <!-- Side Floating Elements -->
  <circle cx="180" cy="180" r="35" fill="#162E44" stroke="#F5A623" stroke-width="2" />
  <text x="180" y="186" fill="#F5A623" font-family="'IBM Plex Sans Arabic', sans-serif" font-size="20" font-weight="bold" text-anchor="middle">🔥</text>

  <circle cx="620" cy="240" r="35" fill="#162E44" stroke="#48CAE4" stroke-width="2" />
  <text x="620" y="246" fill="#48CAE4" font-family="'IBM Plex Sans Arabic', sans-serif" font-size="20" font-weight="bold" text-anchor="middle">⚡</text>

  <!-- Bottom Details -->
  <text x="400" y="445" fill="#FFFFFF" font-family="'IBM Plex Sans Arabic', sans-serif" font-size="22" font-weight="700" text-anchor="middle">بوستر إعلاني لحملة ترويجية للمتاجر</text>
  <text x="400" y="475" fill="#94A3B8" font-family="'IBM Plex Sans Arabic', sans-serif" font-size="14" text-anchor="middle">معدل تحويل ونقر مرتفع (High CTR) ومصمم وفق مقاسات إنستغرام وفيسبوك</text>
</svg>
