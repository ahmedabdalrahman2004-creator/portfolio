<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0B131B" />
      <stop offset="50%" stop-color="#162E44" />
      <stop offset="100%" stop-color="#0E1E2E" />
    </linearGradient>
    <linearGradient id="neonGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#48CAE4" />
      <stop offset="100%" stop-color="#0077B6" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="15" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background -->
  <rect width="800" height="500" fill="url(#bgGrad)" />

  <!-- Grid Pattern -->
  <g stroke="rgba(72, 202, 228, 0.08)" stroke-width="1">
    <line x1="100" y1="0" x2="100" y2="500" />
    <line x1="200" y1="0" x2="200" y2="500" />
    <line x1="300" y1="0" x2="300" y2="500" />
    <line x1="400" y1="0" x2="400" y2="500" />
    <line x1="500" y1="0" x2="500" y2="500" />
    <line x1="600" y1="0" x2="600" y2="500" />
    <line x1="700" y1="0" x2="700" y2="500" />
    <line x1="0" y1="100" x2="800" y2="100" />
    <line x1="0" y1="200" x2="800" y2="200" />
    <line x1="0" y1="300" x2="800" y2="300" />
    <line x1="0" y1="400" x2="800" y2="400" />
  </g>

  <!-- Glowing Accent Shape -->
  <circle cx="400" cy="220" r="140" fill="rgba(72, 202, 228, 0.12)" filter="url(#glow)" />
  <circle cx="400" cy="220" r="110" stroke="#48CAE4" stroke-width="2" fill="none" stroke-dasharray="8 6" opacity="0.6" />

  <!-- Logo Center Icon -->
  <g transform="translate(340, 160)">
    <polygon points="60,0 120,35 120,105 60,140 0,105 0,35" fill="#162E44" stroke="#48CAE4" stroke-width="3" />
    <path d="M40 70 L60 45 L80 70 L60 95 Z" fill="#F5A623" />
    <circle cx="60" cy="70" r="8" fill="#FFFFFF" />
  </g>

  <!-- Typography -->
  <text x="400" y="340" fill="#FFFFFF" font-family="'IBM Plex Sans Arabic', sans-serif" font-size="28" font-weight="700" text-anchor="middle">هوية بصرية لشركة تقنية متقدمة</text>
  <text x="400" y="375" fill="#94A3B8" font-family="'IBM Plex Sans Arabic', sans-serif" font-size="16" text-anchor="middle">تصميم علامة تجارية ودليل استخدام كامل</text>

  <!-- Tags -->
  <g transform="translate(290, 410)">
    <rect width="100" height="30" rx="15" fill="#0B131B" stroke="rgba(72, 202, 228, 0.4)" stroke-width="1"/>
    <text x="50" y="20" fill="#48CAE4" font-family="'IBM Plex Sans Arabic', sans-serif" font-size="12" font-weight="600" text-anchor="middle">Illustrator</text>
  </g>
  <g transform="translate(410, 410)">
    <rect width="100" height="30" rx="15" fill="#0B131B" stroke="rgba(245, 166, 35, 0.4)" stroke-width="1"/>
    <text x="50" y="20" fill="#F5A623" font-family="'IBM Plex Sans Arabic', sans-serif" font-size="12" font-weight="600" text-anchor="middle">Branding</text>
  </g>
</svg>
